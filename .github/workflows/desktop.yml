name: CORE isolated stability test
on:
  workflow_dispatch:
  push:
    branches: [stability-v1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npm test
  build:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check desktop/main.cjs
      - run: node --check desktop/preload.cjs
      - name: Configure isolated test server
        shell: bash
        env:
          CORE_TEST_URL: ${{ vars.CORE_TEST_URL }}
        run: |
          node -e "const u=new URL(process.env.CORE_TEST_URL);if(u.protocol!=='https:'||u.origin==='https://savranai.onrender.com'||u.pathname!=='/'||u.search||u.hash||u.username||u.password)throw Error('Separate HTTPS test origin required');require('fs').writeFileSync('desktop/test-config.json',JSON.stringify({url:u.origin}))"
      - run: npm install
        working-directory: desktop
      - run: npx electron-builder --win --x64 --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: CORE-Test-2.1.0
          path: desktop/dist/*.exe
