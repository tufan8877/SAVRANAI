name: CORE isolated stability test
on:
  workflow_dispatch:
  push:
    branches: [stability-v1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npm test
  build:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check desktop/main.cjs
      - run: node --check desktop/preload.cjs
      - run: npm install
      - run: npm run build
      - name: Package local UI
        shell: bash
        run: cp -r dist desktop/ui
      - run: npm install
        working-directory: desktop
      - run: npx electron-builder --win --x64 --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: CORE-Test-2.1.0
          path: desktop/dist/*.exe
